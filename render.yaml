services:
  - type: web
    name: drishti-backend
    runtime: node
    plan: free
    rootDir: backend-drishti
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: AI_PROVIDER
        value: gemini
      - key: AI_MODEL
        value: gemini-1.5-flash
      - key: AI_API_KEY
        sync: false
      - key: CLIENT_URL
        value: https://drishti-beta-six.vercel.app
      - key: SUPABASE_STORAGE_BUCKET
        value: drishti-images
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "200"
      - key: AI_RATE_LIMIT_MAX_REQUESTS
        value: "50"
